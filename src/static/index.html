<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strativarious · see the glazes inside a watercolor</title>
<meta name="description" content="Take a photo of a watercolor and see which pigments were glazed where, in 3D. Free, open source, runs entirely in your browser.">
<meta name="theme-color" content="#15171c">
<meta property="og:type" content="website">
<meta property="og:title" content="Strativarious · see the glazes inside a watercolor">
<meta property="og:description" content="Break a watercolor down into its glazes and explore them in 3D. Free, open source, nothing uploaded.">
<meta property="og:url" content="https://tcsenpai.github.io/strativarious/">
<meta property="og:image" content="https://tcsenpai.github.io/strativarious/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./style.css">
<style>
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; font-weight: 700; font-size: 18px; }
  .brand img { width: 34px; height: 34px; }
  .nav-actions { display: flex; align-items: center; gap: 8px; }
  .nav-actions .btn { min-height: 36px; padding: 0 14px; font-size: 14px; }
  .ghost { color: var(--muted); text-decoration: none; font-size: 14px; padding: 0 6px; }
  .ghost:hover { color: var(--fg); }
  @media (max-width: 500px) {
    .nav .ghost { display: none; }
    .brand span { display: none; }
    .hero { padding-top: 40px; }
  }

  .hero { text-align: center; padding: 72px 0 36px; }
  .hero img.mark { width: 112px; height: 112px; }
  .eyebrow { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: .04em; margin: 18px 0 10px; }
  .hero h1 { font-size: clamp(34px, 6vw, 60px); line-height: 1.05; letter-spacing: -0.02em; margin: 0 auto; max-width: 19ch; }
  .lead { color: #c4c8d0; font-size: clamp(17px, 2.2vw, 20px); max-width: 60ch; margin: 18px auto 28px; }
  .ctas { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .ctas .btn { min-width: 180px; }

  .video { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #000; margin: 24px 0 8px; }
  .video video { display: block; width: 100%; height: auto; }
  .credit { text-align: center; margin: 0 0 56px; }

  .kicker { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; }
  h2.big { font-size: clamp(24px, 3.4vw, 32px); letter-spacing: -0.01em; margin: 0 0 20px; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 56px; }
  @media (min-width: 620px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { .cards { grid-template-columns: repeat(3, 1fr); } }
  .cards section { margin: 0; }
  .cards h3 { margin: 0 0 6px; font-size: 17px; }
  .cards h3::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px;
                      background: var(--dot, var(--accent)); vertical-align: 1px; }
  .cards p { margin: 0; color: #c4c8d0; font-size: 15px; }
  .steps3 { counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 56px; }
  .steps3 section { margin: 0; counter-increment: s; }
  .steps3 section::before { content: counter(s); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
                            background: var(--accent); color: var(--accent-fg); font-weight: 700; margin-bottom: 10px; }
  .steps3 h3 { margin: 0 0 6px; font-size: 17px; }
  .steps3 p { margin: 0; color: #c4c8d0; font-size: 15px; }
  .honest { margin-bottom: 56px; }
  .honest p { color: #c4c8d0; margin: 0 0 10px; }
  .closing { text-align: center; margin: 0 0 40px; }
  .closing h2 { font-size: clamp(24px, 3.4vw, 32px); margin: 0 0 18px; }
  footer { border-top: 1px solid var(--line); padding-top: 18px; display: flex; gap: 8px 18px; flex-wrap: wrap; justify-content: space-between; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <nav class="nav">
    <a class="brand" href="./" aria-label="Strativarious"><img src="./icons/favicon.svg" alt=""><span>Strativarious</span></a>
    <span class="nav-actions">
      <a class="ghost" href="https://github.com/tcsenpai/strativarious">GitHub</a>
      <span id="langSlot"></span>
      <a class="btn primary" href="./app.html" data-i18n="landing.open"></a>
    </span>
  </nav>

  <header class="hero">
    <img class="mark" src="./icons/favicon.svg" alt="">
    <p class="eyebrow" data-i18n="landing.eyebrow"></p>
    <h1 data-i18n="landing.title"></h1>
    <p class="lead" data-i18n="landing.lead"></p>
    <div class="ctas">
      <a class="btn primary" href="./app.html?demo" data-i18n="landing.tryDemo"></a>
      <a class="btn" href="./app.html" data-i18n="landing.useOwn"></a>
    </div>
  </header>

  <div class="video">
    <video src="./demo.mp4" poster="./demo-poster.jpg" autoplay muted loop playsinline preload="metadata"></video>
  </div>
  <p class="credit small muted" data-i18n-html="landing.videoCredit"></p>

  <p class="kicker" data-i18n="landing.whatKicker"></p>
  <h2 class="big" data-i18n="landing.whatTitle"></h2>
  <div class="cards">
    <section style="--dot: #e8b25e"><h3 data-i18n="landing.f1t"></h3><p data-i18n="landing.f1"></p></section>
    <section style="--dot: #df6b97"><h3 data-i18n="landing.f2t"></h3><p data-i18n="landing.f2"></p></section>
    <section style="--dot: #6276d6"><h3 data-i18n="landing.f3t"></h3><p data-i18n="landing.f3"></p></section>
    <section style="--dot: #2f8f73"><h3 data-i18n="landing.f4t"></h3><p data-i18n="landing.f4"></p></section>
    <section style="--dot: #a0603a"><h3 data-i18n="landing.f5t"></h3><p data-i18n="landing.f5"></p></section>
    <section style="--dot: #8a8f9c"><h3 data-i18n="landing.f6t"></h3><p data-i18n="landing.f6"></p></section>
  </div>

  <p class="kicker" data-i18n="landing.howKicker"></p>
  <h2 class="big" data-i18n="landing.howTitle"></h2>
  <div class="steps3">
    <section><h3 data-i18n="landing.s1t"></h3><p data-i18n="landing.s1"></p></section>
    <section><h3 data-i18n="landing.s2t"></h3><p data-i18n="landing.s2"></p></section>
    <section><h3 data-i18n="landing.s3t"></h3><p data-i18n="landing.s3"></p></section>
  </div>

  <section class="honest">
    <p class="kicker" data-i18n="landing.honestKicker"></p>
    <h2 class="big" style="margin-bottom: 12px" data-i18n="landing.honestTitle"></h2>
    <p data-i18n="landing.honest1"></p>
    <p data-i18n="landing.honest2"></p>
  </section>

  <div class="closing">
    <h2 data-i18n="landing.closing"></h2>
    <div class="ctas">
      <a class="btn primary" href="./app.html" data-i18n="landing.open"></a>
      <a class="btn" href="https://github.com/tcsenpai/strativarious" data-i18n="landing.star"></a>
    </div>
  </div>

  <footer class="small muted">
    <span data-i18n-html="landing.footer"></span>
    <span><a href="https://github.com/tcsenpai/strativarious">GitHub</a> · <a href="https://github.com/tcsenpai/strativarious/blob/main/GUIDE.md" data-i18n="landing.guide"></a> · MIT</span>
  </footer>
</main>
<script type="module" src="./landing.js"></script>
</body>
</html>
